name: pull-request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - &checkout_step
        name: Check out repository
        uses: actions/checkout@v6.0.3

      - &setup_go_step
        name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.go')
          out=$(gofmt -l $files)
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Check code coverage
        shell: bash
        run: bash scripts/check-coverage.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - *checkout_step
      - *setup_go_step

      - name: Run test suite
        run: go test ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
    steps:
      - *checkout_step
      - *setup_go_step

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/check
          go build -trimpath \
            -ldflags="-s -w -X main.version=pr-${GITHUB_SHA::7}" \
            -o "dist/check/mnemonic-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/mnemonic
