name: pull-request
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check-draft:
    name: Check Draft Status
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      run-tests: "true"
    steps:
      - name: Status
        run: echo "PR is ready for review, running pipeline..."
  lint:
    name: Lint & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: check-draft
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m
  check-coverage:
    name: Check Coverage
    runs-on: ubuntu-latest
    needs: check-draft
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Just
        uses: taiki-e/install-action@just
      - name: Check code coverage
        run: just coverage-check 70.0
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - check-draft
      - lint
      - check-coverage
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Just
        uses: taiki-e/install-action@just
      - name: Run test suite
        run: just test-unit
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/check
          go build -trimpath \
            -ldflags="-s -w -X main.version=pr-${GITHUB_SHA::7}" \
            -o "dist/check/mnemonic-${GOOS}-${GOARCH}" \
            ./cmd/mnemonic
