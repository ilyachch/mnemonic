name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive_ext: .tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive_ext: .tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive_ext: .tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive_ext: .tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          archive_base="mnemonic_${VERSION}_${GOOS}_${GOARCH}"
          staging_dir="dist/staging/${archive_base}"
          mkdir -p "$staging_dir"

          go build -trimpath \
            -ldflags="-s -w -X github.com/ilyachch/mnemonic/internal/cli.Version=${VERSION}" \
            -o "${staging_dir}/mnemonic${{ matrix.ext }}" \
            ./cmd/mnemonic

          cp README.md LICENSE "$staging_dir/"
          mkdir -p dist/release

          if [ "${GOOS}" = "windows" ]; then
            (
              cd dist/staging
              zip -r "../release/${archive_base}.zip" "${archive_base}"
            )
          else
            tar -C dist/staging -czf "dist/release/${archive_base}.tar.gz" "${archive_base}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist/release
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          find dist/release -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/release/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: |
            dist/release/*
