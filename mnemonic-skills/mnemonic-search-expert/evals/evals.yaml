version: 1
skill: mnemonic-search-expert
cases:
  - name: go-architecture-last-week
    prompt: Find everything I wrote about Go architecture during the last week.
    expected:
      tool: search_notes
      arguments:
        queries:
          minimum_items: 3
          must_be_semantically_distinct: true
        tags:
          equals:
            - go
        updated_since:
          equals: 7d
      follow_up:
        - read_notes
        - list_backlinks
  - name: expand-after-tag-filter-miss
    prompt: Find my recent notes about deployment under the ops tag, even if the first search is empty.
    expected:
      behavior:
        - Run an initial multi-query search with the requested tag.
        - Remove the tag filter after an empty result.
        - Preserve the user's recency window.
        - Call list_tags to discover alternative categories.
  - name: recover-from-fragments
    prompt: I remember a note mentioning a write lock and a temporary database, but not its title.
    expected:
      behavior:
        - Generate variants covering both remembered fragments and their concepts.
        - Batch-read plausible candidates.
        - Inspect backlinks for the selected note.
