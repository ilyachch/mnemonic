version: 1
skill: mnemonic-architect
cases:
  - name: create-local-project-and-onboard-external-files
    prompt: Create a new local project named research and import all files from ~/Downloads/docs into it.
    expected:
      behavior:
        - Explain that project import onboards the source directory as a separate in-place project and cannot target research.
        - Run mnemonic project init research --local from the intended workspace.
        - Resolve the research memories path with project show.
        - Copy the intended Markdown files without overwriting mnemonic.toml.
        - Run project sync for research.
        - Run project doctor for research.
      forbidden_claim:
        - Do not claim that mnemonic project import ~/Downloads/docs imports into research.
  - name: import-directory-in-place
    prompt: Register ~/Downloads/docs itself as a mnemonic project and hydrate its Markdown files.
    expected:
      sequence:
        - mnemonic project import ~/Downloads/docs --dry-run
        - mnemonic project import ~/Downloads/docs
  - name: remove-without-data-loss
    prompt: Unregister the research project but keep all note files.
    expected:
      command: mnemonic project remove research
      forbidden_flags:
        - --wipe
